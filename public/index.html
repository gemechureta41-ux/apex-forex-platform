<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Forex Academy - Course & OTP Portal</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --accent: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #475569;
            --gold: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); min-height: 100vh; }

        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); display: flex;
            justify-content: center; align-items: center; z-index: 1000;
        }

        .auth-card {
            background: var(--bg-secondary); padding: 35px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6); width: 100%; max-width: 420px;
            text-align: center; border: 1px solid var(--border);
        }

        .auth-card h2 { margin-bottom: 10px; color: #38bdf8; }
        .auth-card p.desc { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
        .bot-link { color: #38bdf8; font-weight: bold; text-decoration: none; }

        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 12px; margin-bottom: 5px; color: #cbd5e1; }
        input[type="email"], input[type="text"] {
            width: 100%; padding: 12px; border-radius: 6px;
            border: 1px solid var(--border); background: var(--bg-primary);
            color: #fff; font-size: 14px; text-align: center; outline: none;
        }

        button.btn-primary {
            width: 100%; padding: 12px; background: var(--accent);
            color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
        }

        .hidden { display: none !important; }
        #message { margin-top: 15px; font-size: 13px; font-weight: 500; }
        .success { color: #4ade80; }
        .error { color: #f87171; }

        #app-container { display: flex; height: 100vh; width: 100%; }

        #sidebar {
            width: 340px; background-color: var(--bg-secondary);
            border-right: 1px solid var(--border); display: flex;
            flex-direction: column; flex-shrink: 0;
        }

        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); background: #0f172a; }
        .sidebar-header h1 { font-size: 18px; color: #38bdf8; }
        .search-box {
            margin-top: 10px; width: 100%; padding: 8px 12px;
            border-radius: 6px; border: 1px solid var(--border);
            background: var(--bg-primary); color: #fff; font-size: 13px;
        }

        .module-list { overflow-y: auto; flex-grow: 1; padding: 10px; }
        .module-item { margin-bottom: 8px; border-radius: 6px; background: var(--bg-card); border: 1px solid var(--border); overflow: hidden; }
        .module-title {
            padding: 12px; font-size: 13px; font-weight: bold;
            cursor: pointer; display: flex; justify-content: space-between;
            align-items: center; background: #1e293b; color: #e5e7eb;
        }

        .lesson-list { display: none; list-style: none; background: var(--bg-secondary); }
        .lesson-list.active { display: block; }
        .lesson-item {
            padding: 10px 15px 10px 25px; font-size: 12px;
            color: var(--text-muted); cursor: pointer; border-bottom: 1px solid var(--border);
        }
        .lesson-item:hover, .lesson-item.active { background: var(--accent); color: #fff; }

        #main-content { flex-grow: 1; overflow-y: auto; padding: 40px; background: var(--bg-primary); }
        .content-header { border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 25px; }
        .content-header h2 { font-size: 26px; color: #38bdf8; margin-bottom: 5px; }
        .content-header .breadcrumb { font-size: 13px; color: var(--gold); }

        .paragraph {
            background: var(--bg-secondary); padding: 20px; border-radius: 8px;
            margin-bottom: 20px; border-left: 4px solid var(--accent);
            line-height: 1.7; font-size: 15px; color: #d1d5db;
        }
        .paragraph h4 { color: #f3f4f6; margin-bottom: 10px; font-size: 16px; }
        .callout {
            background: rgba(2, 132, 199, 0.1); border: 1px dashed var(--accent);
            padding: 15px; border-radius: 6px; margin: 20px 0; font-size: 14px; color: #7dd3fc;
        }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2>Apex Forex Access</h2>
            <p class="desc">Dura Telegram irratti <a href="https://t.me/apex_forex_assistant_bot" target="_blank" class="bot-link">@apex_forex_assistant_bot</a> **Start** gochuun Email keessan galmeessaa!</p>

            <div id="step-email">
                <div class="input-group">
                    <label for="emailInput">Email Kee Galchi:</label>
                    <input type="email" id="emailInput" placeholder="example@gmail.com">
                </div>
                <button class="btn-primary" onclick="sendOTP()">OTP Ergi</button>
            </div>

            <div id="step-otp" class="hidden">
                <div class="input-group">
                    <label for="otpInput">Koodii Digiti 6 Telegram irraa siif ergame:</label>
                    <input type="text" id="otpInput" maxlength="6" placeholder="123456">
                </div>
                <button class="btn-primary" onclick="verifyOTP()">Verify & Access Platform</button>
            </div>

            <div id="message"></div>
        </div>
    </div>

    <div id="app-container" class="hidden">
        <div id="sidebar">
            <div class="sidebar-header">
                <h1>📈 Apex Forex Masterclass</h1>
                <input type="text" class="search-box" id="search" placeholder="Moojula ykn Barnoota barbaadi..." onkeyup="filterCourses()">
            </div>
            <div class="module-list" id="moduleContainer"></div>
        </div>

        <div id="main-content">
            <div class="content-header">
                <div class="breadcrumb" id="breadCrumb">Moojula 1 / Barnoota 1</div>
                <h2 id="lessonTitle">Baga Nagaan Dhuftan!</h2>
            </div>
            <div id="lessonBody"></div>
        </div>
    </div>

<script>
    async function sendOTP() {
        const email = document.getElementById('emailInput').value;
        const msgDiv = document.getElementById('message');
        msgDiv.className = '';
        msgDiv.innerText = 'Processing...';

        try {
            const res = await fetch('/api/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();

            if (data.success) {
                msgDiv.className = 'success';
                msgDiv.innerText = data.message;
                document.getElementById('step-email').classList.add('hidden');
                document.getElementById('step-otp').classList.remove('hidden');
            } else {
                msgDiv.className = 'error';
                msgDiv.innerText = data.message;
            }
        } catch (err) {
            msgDiv.className = 'error';
            msgDiv.innerText = 'Server error occurred!';
        }
    }

    async function verifyOTP() {
        const email = document.getElementById('emailInput').value;
        const otp = document.getElementById('otpInput').value;
        const msgDiv = document.getElementById('message');
        msgDiv.className = '';
        msgDiv.innerText = 'Verifying...';

        try {
            const res = await fetch('/api/verify-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, otp })
            });
            const data = await res.json();

            if (data.success) {
                msgDiv.className = 'success';
                msgDiv.innerText = data.message;
                
                setTimeout(() => {
                    document.getElementById('auth-overlay').classList.add('hidden');
                    document.getElementById('app-container').classList.remove('hidden');
                    renderApp();
                    loadLesson(0, 0);
                }, 500);
            } else {
                msgDiv.className = 'error';
                msgDiv.innerText = data.message;
            }
        } catch (err) {
            msgDiv.className = 'error';
            msgDiv.innerText = 'Server error occurred!';
        }
    }

    const courseData = Array.from({ length: 15 }, (_, mIdx) => {
        const mNum = mIdx + 1;
        const moduleTitles = [
            "Seensa Forex Trading & Bu'uura Maasketii", "Currency Pairs fi Pips Calculation",
            "Lot Size, Leverage & Risk Management", "Market Structure & Trend Analysis",
            "Smart Money Concepts (SMC) Bu'uura", "Order Blocks (OB) & Supply/Demand",
            "Fair Value Gap (FVG) & Imbalance", "Change of Character (CHoCH) & BOS",
            "Liquidity Sweeps & Session Timing", "Trading Gold (XAU/USD) Masterclass",
            "EUR/USD Trading Strategy & Rules", "Multi-Timeframe Analysis (4H fi 15M)",
            "Prop Firm Evaluation Rules (Goat Funded)", "Trading Psychology & Discipline",
            "Trading Plan, Journaling & Backtesting"
        ];

        return {
            id: mNum,
            title: `Moojula ${mNum}: ${moduleTitles[mIdx]}`,
            lessons: [
                {
                    title: `Barnoota ${mNum}.1: Bu'uura ${moduleTitles[mIdx]}`,
                    paragraphs: [
                        { h: "1. Keeyyata Ibsa Bu'uuraa", t: `${moduleTitles[mIdx]} ilaalchisee barnoonni kun yaada bu'uuraa fi teeknika gabaa keessatti barbaachisu tokkoon tokkoon ibsa. Gabaa Forex keessatti beekumsa gahaa qabaachuun balaa loss xiqqeessuuf baay'ee murteessaadha.` },
                        { h: "2. Hojirra Oolmaa Gabaa", t: "Chaartii irratti sochii gatii (Price Action) hordofuun bakka gabaan itti jallatu ykn kallattii jijjiiratu addaan baafachuun ni danda'ama. Kanaafuu yaada kana hojiirra oolchuun murtii sirrii akka fudhattan si gargaara." },
                        { h: "3. Yeroo fi Mala Entry", t: "SMC fi Price Action fayyadamuun 15M timeframe irratti entry qulqulluu qabachuuf higher timeframe (4H) irratti bias qabaachuun utubbaa teeknika trade keetiiti." }
                    ]
                },
                {
                    title: `Barnoota ${mNum}.2: Deep Dive & Strategies`,
                    paragraphs: [
                        { h: "1. Teeknika Gadi Fageenyaa", t: "Gabaan yeroo hunda liquidity barbaacha socho'a. Order Block fi Fair Value Gap fayyadamta taanaan bakka bangiifi dhaabbileen gurguddoon order kaa'an addaan baasuu dandeessa." },
                        { h: "2. Analysis & Confirmation", t: "Kallattiin trade keessa galuu dura confirmation (CHoCH ykn Liquidity Sweep) eeguun barbaachisaadha. Confirmation malee trade galuun hamma Stop Loss kee bal'isa." },
                        { h: "3. Execute Gochuu fi Risk Management", t: "Trade kamuu irratti account kee keessaa 1% ykn 0.5% qofa risk gochuu qabda. Account draw-down keessa akka hin galleef dhimmi kun murteessaadha." }
                    ]
                },
                {
                    title: `Barnoota ${mNum}.3: Risk & Real Example`,
                    paragraphs: [
                        { h: "1. Fakkeenya Chaartii Real-time", t: "Gold (XAU/USD) fi EUR/USD irratti setup xiyyeeffannoo qabu addaan baasanii hojjechuun firii gaarii siif kenna. Yeroo London fi New York Session qofa trade gochuun baay'ee gorfamaadha." },
                        { h: "2. Dogoggora Akeekkachiisaa", t: "Over-trading fi FOMO irraa fagaachuun seera trading keetii hordofuu qabda. Gabaa hunda hordofuu dhiistanii pairs muraasa qofa xiyyeeffachuun gaariidha." },
                        { h: "3. Gudunfaa fi Rule Book", t: "Boodarra journal kee keessatti trade hunda galmeessitee xiinxaluun teeknika kee guddifachuuf injineera guddaadha." }
                    ]
                }
            ]
        };
    });

    function renderApp() {
        const container = document.getElementById('moduleContainer');
        container.innerHTML = '';

        courseData.forEach((mod, mIndex) => {
            const mDiv = document.createElement('div');
            mDiv.className = 'module-item';
            mDiv.innerHTML = `
                <div class="module-title" onclick="toggleModule(${mIndex})">
                    <span>${mod.title}</span>
                    <span id="icon-${mIndex}">▼</span>
                </div>
                <ul class="lesson-list" id="lessons-${mIndex}">
                    ${mod.lessons.map((les, lIndex) => `
                        <li class="lesson-item" onclick="loadLesson(${mIndex}, ${lIndex})">📌 ${les.title}</li>
                    `).join('')}
                </ul>
            `;
            container.appendChild(mDiv);
        });
    }

    function toggleModule(mIndex) {
        const list = document.getElementById(`lessons-${mIndex}`);
        const icon = document.getElementById(`icon-${mIndex}`);
        const isActive = list.classList.contains('active');

        document.querySelectorAll('.lesson-list').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('[id^="icon-"]').forEach(el => el.innerText = '▼');

        if (!isActive) {
            list.classList.add('active');
            icon.innerText = '▲';
        }
    }

    function loadLesson(mIndex, lIndex) {
        const lesson = courseData[mIndex].lessons[lIndex];
        document.getElementById('breadCrumb').innerText = `${courseData[mIndex].title} > ${lesson.title}`;
        document.getElementById('lessonTitle').innerText = lesson.title;

        const bodyContainer = document.getElementById('lessonBody');
        bodyContainer.innerHTML = '';

        lesson.paragraphs.forEach(p => {
            const pDiv = document.createElement('div');
            pDiv.className = 'paragraph';
            pDiv.innerHTML = `<h4>${p.h}</h4><p>${p.t}</p>`;
            bodyContainer.appendChild(pDiv);
        });

        const callout = document.createElement('div');
        callout.className = 'callout';
        callout.innerHTML = `💡 <b>Apex Forex Rule:</b> Risk Management fi Smart Money Concepts (SMC) hordofuun bu'uura maasketiiti.`;
        bodyContainer.appendChild(callout);
    }

    function filterCourses() {
        const query = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.module-item').forEach((mEl, mIndex) => {
            const title = courseData[mIndex].title.toLowerCase();
            mEl.style.display = title.includes(query) ? 'block' : 'none';
        });
    }
</script>
</body>
</html>
